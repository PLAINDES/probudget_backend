services:
  app:
    build: .
    container_name: probudget_backend
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env:ro
    ports:
      - "8001:80"
    restart: always
    mem_limit: 1g
    cpus: "1"
    networks:
      - probudget_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  probudget_net:
    external: true